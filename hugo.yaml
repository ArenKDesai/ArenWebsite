baseURL: "https://arendesai.com"
title: "Aren Desai"
theme: "mainroad"

languageCode: "en-us"

# Mainroad parameter configuration
params:
  description: "Aren Desai's professional website. Data scientist, machine learning engineer, and energy market analyst."
  author: "Aren Desai"
  opengraph: true
  twitter_cards: false
  readmore: true
  # Mainroad style configuration
  style:
    vars:
      highlightColor: "#a7c080" # Everforest Green
      fontFamilyPrimary: "'Inter', 'Open Sans', Helvetica, Arial, sans-serif"

  # Sidebar: left/right/false
  sidebar:
    home: false
    list: false
    single: false
    widgets:
      # - search  <-- Removed as requested
      - recent
      - categories
      - taglist
      - social
  
  # Social links (Mainroad specific)
  social:
    github: "ArenKDesai"
    email: "arenkdesai@gmail.com"
    linkedin: "aren-desai" # Assuming linkedin based on name, can remove if not known, but often standard. User gave github/email.
    # User provided: github.com/ArenKDesai, arendesai.com, arenkdesai@gmail.com
  
  # Custom CSS
  customCSS: ["css/everforest.css"]


menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Experience
      url: /experience/
      weight: 2
    - name: Projects
      url: /projects/
      weight: 3
    - name: Education
      url: /education/
      weight: 4
    - name: Skills
      url: /skills/
      weight: 5

markup:
  goldmark:
    renderer:
      unsafe: true
